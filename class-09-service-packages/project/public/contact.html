<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Ekramul Islam</title>
  <meta name="description" content="Send a project request and get a free quote within 24 hours.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Poppins:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4">
      <a href="index.html" class="font-display text-xl font-bold text-slate-900">Ekramul<span class="text-brand-600">.dev</span></a>
      <nav aria-label="Main">
        <ul class="hidden gap-6 md:flex">
          <li><a href="index.html#about" class="text-slate-600 hover:text-brand-600">About</a></li>
          <li><a href="index.html#projects" class="text-slate-600 hover:text-brand-600">Projects</a></li>
          <li><a href="index.html#services" class="text-slate-600 hover:text-brand-600">Services</a></li>
          <li><a href="contact.html" class="text-slate-600 hover:text-brand-600">Contact</a></li>
        </ul>
      </nav>

      <button type="button" popovertarget="mobile-menu" class="rounded-lg p-2 hover:bg-slate-100 md:hidden">
        <span class="sr-only">Open menu</span>
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>

    <nav id="mobile-menu" popover aria-label="Mobile" class="m-0 ml-auto h-dvh w-64 bg-white p-6 shadow-2xl backdrop:bg-slate-900/50">
      <button type="button" popovertarget="mobile-menu" popovertargetaction="hide" class="mb-6 font-semibold">✕ Close</button>
      <ul class="space-y-4 text-lg">
        <li><a href="index.html#about" class="hover:text-brand-600">About</a></li>
        <li><a href="index.html#projects" class="hover:text-brand-600">Projects</a></li>
        <li><a href="index.html#services" class="hover:text-brand-600">Services</a></li>
        <li><a href="contact.html" class="hover:text-brand-600">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="contact" class="mx-auto grid max-w-6xl gap-12 px-4 py-20 lg:grid-cols-3">
      <div>
        <h1 class="text-4xl font-bold">Let's work together</h1>
        <p class="mt-4">Fill in the form and I will reply within 24 hours.</p>
        <iframe title="Map of Dhaka" src="https://www.openstreetmap.org/export/embed.html?bbox=90.35%2C23.70%2C90.45%2C23.82&amp;layer=mapnik"
                width="600" height="300" loading="lazy" class="mt-8 aspect-video w-full rounded-2xl"></iframe>
      </div>

      <form name="contact" action="thank-you.html" method="POST" data-netlify="true" class="card space-y-8 lg:col-span-2">
        <input type="hidden" name="form-name" value="contact">

        <fieldset class="grid gap-5 sm:grid-cols-2">
          <legend class="mb-4 text-lg font-semibold text-slate-900">About you</legend>

          <div>
            <label for="name">Full name *</label>
            <input type="text" id="name" name="name" required minlength="3" placeholder="e.g. Karim Uddin" class="form-input">
          </div>

          <div>
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="you@company.com" class="form-input">
          </div>

          <div class="sm:col-span-2">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX"
                   title="11-digit Bangladeshi number, e.g. 01712345678" class="form-input">
          </div>
        </fieldset>

        <fieldset class="grid gap-5 sm:grid-cols-2">
          <legend class="mb-4 text-lg font-semibold text-slate-900">Your project</legend>

          <div>
            <label for="service">Service *</label>
            <select id="service" name="service" required class="form-input">
              <option value="">-- Choose a service --</option>
              <option value="landing">Landing page</option>
              <option value="business">Business website</option>
              <option value="convert">Design to code</option>
            </select>
          </div>

          <div>
            <label for="deadline">Deadline</label>
            <input type="date" id="deadline" name="deadline" class="form-input">
          </div>

          <div class="sm:col-span-2">
            <p>Package *</p>
            <div class="mt-2 flex flex-wrap gap-6">
              <label class="flex items-center gap-2"><input type="radio" name="package" value="basic" required class="text-brand-600"> Basic</label>
              <label class="flex items-center gap-2"><input type="radio" name="package" value="standard" class="text-brand-600"> Standard</label>
              <label class="flex items-center gap-2"><input type="radio" name="package" value="premium" class="text-brand-600"> Premium</label>
            </div>
          </div>

          <div class="sm:col-span-2">
            <label for="message">Project details *</label>
            <textarea id="message" name="message" rows="5" required minlength="20" class="form-input"></textarea>
          </div>
        </fieldset>

        <label class="flex items-center gap-2"><input type="checkbox" name="consent" required class="rounded text-brand-600"> I agree to be contacted *</label>

        <button type="submit" class="btn-primary">Send request</button>
      </form>
    </section>
  </main>

  <footer class="bg-slate-900 text-slate-400">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-4 py-8 sm:flex-row">
      <address class="not-italic">
        Email: <a href="mailto:hello@example.com" class="text-white hover:underline">hello@example.com</a>
      </address>
      <p class="text-sm">&copy; 2026 Ekramul Islam</p>
    </div>
  </footer>

</body>
</html>
